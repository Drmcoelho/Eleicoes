name: Post-election audit integrity
on: [push, pull_request]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python reports/audits/cofre-a-2t-2026-10-26/verify.py
      - run: python analysis/exploratory/2026-2t/reproduce.py --check
      - run: python -m unittest discover -s analysis/exploratory/2026-2t -p 'test_*.py' -v
